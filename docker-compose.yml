# =====================================
# Win AI - Docker Compose
# Full stack: Backend + Frontend
# =====================================

services:
  # =====================================
  # Backend - Spring Boot
  # =====================================
  # =====================================
  # Redis - Cache & Message Broker
  # Para suprimir o aviso "Memory overcommit" no host: sysctl vm.overcommit_memory=1
  # =====================================
  redis:
    image: redis:alpine
    container_name: winai-redis
    ports:
      - "16379:6379"
    command: redis-server --save 60 1 --loglevel warning
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - winai-network
    restart: unless-stopped

  # =====================================
  # Backend - Spring Boot
  # =====================================
  backend:
    build:
      context: ./winai-backend
      dockerfile: Dockerfile
    container_name: winai-backend
    ports:
      - "18080:8080"
    # 127.0.0.11 = Docker embedded DNS (redis, etc). 8.8.8.8 = fallback externo.
    dns:
      - 127.0.0.11
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          memory: 768M
    environment:
      # Timezone
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:+UseStringDeduplication -Djava.net.preferIPv4Stack=true
      # Spring Profile for Docker
      - SPRING_PROFILES_ACTIVE=docker
      - HIKARI_MAX_POOL_SIZE=${HIKARI_MAX_POOL_SIZE:-40}

      - SPRING_DATASOURCE_URL=${DATABASE_POOLER_URL:-${SPRING_DATASOURCE_URL}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      # JPA/Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=winai
      # Flyway
      - SPRING_FLYWAY_SCHEMAS=winai
      - SPRING_FLYWAY_DEFAULT_SCHEMA=winai
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}

      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}

      # App URLs
      - APP_FRONTEND_URL=${FRONTEND_URL}

      # UaZap (WhatsApp)
      - UAZAP_DEFAULT_BASE_URL=${UAZAP_BASE_URL}
      - UAZAP_DEFAULT_TOKEN=${UAZAP_TOKEN}
      - UAZAP_DEFAULT_INSTANCE=${UAZAP_INSTANCE}
      - UAZAP_ADMIN_TOKEN=${UAZAP_ADMIN_TOKEN}

      # Asaas (Pagamentos)
      - ASAAS_API_TOKEN=${ASAAS_API_TOKEN}
      - ASAAS_WEBHOOK_URL=${ASAAS_WEBHOOK_URL:-https://server.somosamplia.com/api/v1/asaas/webhook}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # Meta Sync
      - META_SYNC_ENABLED=false

      # Asaas Payment Gateway
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_API_TOKEN=${ASAAS_API_TOKEN}

      # Meta (Facebook/Instagram)
      - META_CLIENT_ID=${META_CLIENT_ID}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET}
      - META_REDIRECT_URI=${META_REDIRECT_URI:-https://server.somosamplia.com/api/v1/marketing/auth/meta/callback}
      - META_CONFIG_ID=${META_CONFIG_ID:-1792297934776856}
      # Meta API rate limit (doc: development=300s, standard=60s block)
      - META_API_THROTTLE_DELAY_MS=${META_API_THROTTLE_DELAY_MS:-2000}
      - META_API_RATE_LIMIT_RETRY_WAIT_MS=${META_API_RATE_LIMIT_RETRY_WAIT_MS:-300000}
      - META_API_ACCESS_TIER=${META_API_ACCESS_TIER:-development_access}

      # Internal API Key
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      redis:
        condition: service_started
    networks:
      - winai-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "--max-time", "15", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # =====================================
  # Meta Sync Worker - Background Tasks
  # =====================================
  meta-sync:
    build:
      context: ./winai-backend
      dockerfile: Dockerfile
    container_name: winai-meta-sync
    dns:
      - 127.0.0.11
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true
      - SPRING_PROFILES_ACTIVE=docker,meta-sync
      - SPRING_DATASOURCE_URL=${DATABASE_POOLER_URL:-${SPRING_DATASOURCE_URL}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - META_CLIENT_ID=${META_CLIENT_ID}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET}
      - META_API_THROTTLE_DELAY_MS=${META_API_THROTTLE_DELAY_MS:-2000}
      - META_API_RATE_LIMIT_RETRY_WAIT_MS=${META_API_RATE_LIMIT_RETRY_WAIT_MS:-300000}
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_API_TOKEN=${ASAAS_API_TOKEN}
      - META_SYNC_ENABLED=true
      # A cada 12 horas (evita sobrecarga Meta API / rate limit)
      - META_SYNC_CRON=0 0 */12 * * *
      # UaZap
      - UAZAP_BASE_URL=${UAZAP_BASE_URL}
      - UAZAP_TOKEN=${UAZAP_TOKEN}
      - UAZAP_INSTANCE=${UAZAP_INSTANCE}
      - UAZAP_ADMIN_TOKEN=${UAZAP_ADMIN_TOKEN}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - APP_FRONTEND_URL=${FRONTEND_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - winai-network
    restart: unless-stopped

  # =====================================
  # AI Recommendations Worker - Otimizações Neurais
  # Popula cache de recomendações a cada 5 min para empresas com Meta Ads
  # =====================================
  ai-recommendations-worker:
    build:
      context: ./winai-backend
      dockerfile: Dockerfile
    container_name: winai-ai-recommendations-worker
    dns:
      - 127.0.0.11
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true
      - SPRING_PROFILES_ACTIVE=docker,ai-recommendations-worker
      - SPRING_DATASOURCE_URL=${DATABASE_POOLER_URL:-${SPRING_DATASOURCE_URL}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - META_CLIENT_ID=${META_CLIENT_ID}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET}
      - META_API_THROTTLE_DELAY_MS=${META_API_THROTTLE_DELAY_MS:-2000}
      - META_API_RATE_LIMIT_RETRY_WAIT_MS=${META_API_RATE_LIMIT_RETRY_WAIT_MS:-300000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_API_TOKEN=${ASAAS_API_TOKEN}
      - APP_FRONTEND_URL=${FRONTEND_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - winai-network
    restart: unless-stopped

  # =====================================
  # Follow-up Worker - Automated Lead Reengagement
  # =====================================
  followup-worker:
    build:
      context: ./winai-backend
      dockerfile: Dockerfile
    container_name: winai-followup-worker
    dns:
      - 127.0.0.11
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true
      - SPRING_PROFILES_ACTIVE=docker,followup-worker
      - SPRING_DATASOURCE_URL=${DATABASE_POOLER_URL:-${SPRING_DATASOURCE_URL}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FOLLOWUP_WORKER_ENABLED=true
      # UaZap (WhatsApp) - necessário para enviar follow-ups
      - UAZAP_BASE_URL=${UAZAP_BASE_URL}
      - UAZAP_TOKEN=${UAZAP_TOKEN}
      - UAZAP_INSTANCE=${UAZAP_INSTANCE}
      - UAZAP_ADMIN_TOKEN=${UAZAP_ADMIN_TOKEN}
      # Meta
      - META_CLIENT_ID=${META_CLIENT_ID}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET}
      # Asaas
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_API_TOKEN=${ASAAS_API_TOKEN}
      - APP_FRONTEND_URL=${FRONTEND_URL}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Supabase (para storage de arquivos se necessário)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - winai-network
    restart: unless-stopped

  # =====================================
  # Python Backend - Clinicorp Sync
  # =====================================
  python-backend:
    build:
      context: ./clinicorp
      dockerfile: Dockerfile
    container_name: winai-python-backend
    ports:
      - "15000:5000"
    dns:
      - 127.0.0.11
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    environment:
      - TZ=America/Sao_Paulo
      - FLASK_ENV=production
      - CLINICORP_USERNAME=${CLINICORP_USERNAME}
      - CLINICORP_PASSWORD=${CLINICORP_PASSWORD}
      - CLINICORP_CLINIC_ID=${CLINICORP_CLINIC_ID}
      - DATABASE_URL=${DATABASE_URL}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS}
    networks:
      - winai-network
    restart: unless-stopped

  # =====================================
  # Lead Qualifier - AI Lead Qualification
  # =====================================
  lead-qualifier:
    build:
      context: ./lead-qualifier
      dockerfile: Dockerfile
    container_name: winai-lead-qualifier
    dns:
      - 127.0.0.11
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_API_URL=http://backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-1024}
      # Delay em ms entre requisições OpenAI (evita rate limit)
      - OPENAI_DELAY_BETWEEN_REQUESTS_MS=${OPENAI_DELAY_BETWEEN_REQUESTS_MS:-1000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CRON_INTERVAL_MINUTES=30
      - RUN_ON_STARTUP=true
      - INITIAL_DELAY_SECONDS=30
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - winai-network
    restart: unless-stopped

  # =====================================
  # Frontend - Vite + React + Nginx
  # =====================================
  frontend:
    build:
      context: ./winai
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: winai-frontend
    ports:
      - "13000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - winai-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

# =====================================
# Networks
# =====================================
networks:
  winai-network:
    driver: bridge
