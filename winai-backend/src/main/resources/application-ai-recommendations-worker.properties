# Ativado com: SPRING_PROFILES_ACTIVE=docker,ai-recommendations-worker
# Worker que popula o cache de recomendações de IA para campanhas Meta Ads

ai.recommendations.worker.enabled=true
# Intervalo em ms (14400000 = 4 horas - evita sobrecarga Meta/OpenAI)
ai.recommendations.worker.interval-ms=14400000

spring.datasource.hikari.pool-name=HikariPool-ai-recommendations
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
