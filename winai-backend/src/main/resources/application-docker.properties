# =====================================
# Amplia Backend - Docker Profile
# =====================================
# Ativado com: SPRING_PROFILES_ACTIVE=docker
# =====================================

spring.application.name=winai

# ========================================
# Database Configuration
# ========================================
# Uses environment variables from Docker Compose
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=winai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:public}

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:public}
spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.pool-name=HikariPool-backend
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:40}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ========================================
# JWT Configuration
# ========================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ========================================
# Supabase API Keys
# ========================================
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# ========================================
# Google APIs (Drive/Calendar)
# ========================================
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:https://server.somosamplia.com/api/v1/drive/callback}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
meta.client.id=${META_CLIENT_ID}
meta.client.secret=${META_CLIENT_SECRET}
meta.config.id=${META_CONFIG_ID:}
meta.redirect.uri=${META_REDIRECT_URI:https://server.somosamplia.com/api/v1/marketing/auth/meta/callback}
meta.api.base-url=${META_API_URL:https://graph.facebook.com/v19.0}
# Rate limit (baseado na doc Meta): throttle entre req, retry wait, tier
# Meta: development_access=300s block, standard_access=60s block
meta.api.throttle-delay-ms=${META_API_THROTTLE_DELAY_MS:2000}
meta.api.rate-limit-retry-wait-ms=${META_API_RATE_LIMIT_RETRY_WAIT_MS:300000}
meta.api.access-tier=${META_API_ACCESS_TIER:development_access}

# ========================================
# Server Configuration - Escalado para 1000+ usuários
# ========================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
# Tomcat: mais threads para concorrência (webhooks, API, WebSocket)
server.tomcat.threads.max=200
server.tomcat.max-connections=1000
server.tomcat.accept-count=100

# ========================================
# Actuator (Health Checks for Docker)
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ========================================
# Multipart File Upload Configuration
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# ========================================
# Uazap WhatsApp API Configuration
# ========================================
uazap.default-base-url=${UAZAP_BASE_URL:}
uazap.default-token=${UAZAP_TOKEN:}
uazap.default-instance=${UAZAP_INSTANCE:}
uazap.admin-token=${UAZAP_ADMIN_TOKEN:}
uazap.webhook.url=${UAZAP_WEBHOOK_URL:https://server.somosamplia.com/api/v1/webhook/whatsapp}

# ========================================
# Asaas Payment Gateway
# ========================================
asaas.api.token=${ASAAS_API_TOKEN}
asaas.webhook.url=${ASAAS_WEBHOOK_URL:https://server.somosamplia.com/api/v1/asaas/webhook}
asaas.api.url=${ASAAS_API_URL:https://api.asaas.com/v3}

# ========================================
# Python Backend Configuration (Clinicorp)
# ========================================
python.backend.url=${PYTHON_BACKEND_URL:http://winai-python-backend:5000/api}

# ========================================
# Asaas Payment Gateway Configuration
# ========================================
asaas.api.url=${ASAAS_API_URL:https://api.asaas.com/v3}
asaas.api.token=${ASAAS_API_TOKEN}

# ========================================
# Logging (Container optimized)
# ========================================
logging.level.root=INFO
logging.level.com.backend.winai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
