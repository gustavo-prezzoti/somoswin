
spring.datasource.hikari.pool-name=HikariPool-meta-sync
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# Sync pode levar 30-60s; evitar falso positivo de connection leak
spring.datasource.hikari.leak-detection-threshold=120000

# Sincronização a cada hora (Spring cron: seg min hora dia mês dia-semana)
meta.sync.cron=0 0 * * * *
meta.sync.enabled=true
# Delay em ms antes do sync inicial (após restart do container) - garante DB pronto
meta.sync.initial-delay-ms=15000
