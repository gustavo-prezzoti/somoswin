# Ativado com: SPRING_PROFILES_ACTIVE=docker,broadcast-worker
# Processa envios agendados de remarketing (Base Ativa).

spring.main.web-application-type=none

winai.broadcast.worker.enabled=true

meta.sync.enabled=false

spring.datasource.hikari.pool-name=HikariPool-broadcast
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.leak-detection-threshold=180000

logging.level.com.backend.winai.service.WhatsAppBroadcastService=INFO
logging.level.com.backend.winai.service.WhatsAppBroadcastWorkerScheduler=INFO
