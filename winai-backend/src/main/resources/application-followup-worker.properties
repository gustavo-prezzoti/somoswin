# =====================================
# Amplia Backend - Follow-up Worker Profile
# =====================================
# Ativado com: SPRING_PROFILES_ACTIVE=docker,followup-worker
# =====================================

# Desabilita servidor web (worker não precisa expor porta)
spring.main.web-application-type=none

# Habilita apenas o scheduler de follow-up
followup.worker.enabled=true
# Cron: a cada 5 min (evita sobrecarga - antes era 1 min)
followup.worker.cron=0 */5 * * * *

# Desabilita outros schedulers neste container
meta.sync.enabled=false

spring.datasource.hikari.pool-name=HikariPool-followup
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
# Evita falso positivo de leak durante processamento longo (IA + envio Uazap)
spring.datasource.hikari.leak-detection-threshold=180000

# Logging otimizado para follow-up
logging.level.com.backend.winai.service.FollowUpScheduler=INFO
logging.level.com.backend.winai.service.FollowUpService=INFO
